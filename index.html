<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>English Path</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0e7c72">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="English Path">
<style>
:root{--bg:#f5f3ee;--card:#fff;--ink:#1c2b2f;--mut:#667479;--acc:#0e7c72;--accs:#d9efec;--warm:#c4501b;--ok:#17803d;--oks:#dff3e5;--bad:#b3261e;--bads:#f9e1de;--line:#e3dfd3}
@media(prefers-color-scheme:dark){:root{--bg:#121a1c;--card:#1b2629;--ink:#e8efef;--mut:#93a4a8;--acc:#3cc4b6;--accs:#173a38;--warm:#f08a55;--ok:#5ad083;--oks:#16341f;--bad:#ff8a80;--bads:#3b1d1a;--line:#2a373a}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:18px 16px 100px}
h1{font-size:27px;margin:4px 0 2px;letter-spacing:-.02em;line-height:1.15}
h2{font-size:13px;margin:26px 0 8px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);font-weight:700}
p{margin:6px 0}
.sub{color:var(--mut);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:10px 0}
.row{display:flex;gap:10px;align-items:center}
.sp{justify-content:space-between}
.grow{flex:1;min-width:0}
.btn{appearance:none;border:0;background:var(--acc);color:#fff;font:inherit;font-weight:650;padding:13px 18px;border-radius:12px;width:100%;cursor:pointer}
.btn.sec{background:var(--accs);color:var(--acc)}
.btn.ghost{background:transparent;color:var(--mut);border:1px solid var(--line)}
.btn.warm{background:var(--warm)}
.btn.sm{width:auto;padding:8px 14px;font-size:14px;border-radius:10px}
.btn:disabled{opacity:.45}
.btn+.btn{margin-top:8px}
.chip{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:99px;background:var(--accs);color:var(--acc)}
.chip.w{background:#fbe6da;color:var(--warm)}
@media(prefers-color-scheme:dark){.chip.w{background:#3d2517}}
.item{display:flex;align-items:center;gap:12px;padding:14px 16px;background:var(--card);border:1px solid var(--line);border-radius:14px;margin:8px 0;cursor:pointer}
.item .t{font-weight:650}
.num{font-size:30px;font-weight:750;letter-spacing:-.02em;line-height:1}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--acc);border-radius:99px;transition:width .3s}
.ladder{display:flex;gap:6px;margin-top:10px}
.ladder div{flex:1;text-align:center;padding:8px 0;border-radius:10px;background:var(--line);color:var(--mut);font-weight:700;font-size:14px}
.ladder .on{background:var(--acc);color:#fff}
.ladder .now{outline:2px solid var(--warm);outline-offset:1px}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding:4px 2px calc(4px + env(safe-area-inset-bottom));z-index:5}
nav a{flex:1;text-align:center;padding:10px 0 8px;font-size:12.5px;font-weight:650;color:var(--mut);text-decoration:none;position:relative}
nav a.on{color:var(--acc)}
nav a.on:after{content:"";position:absolute;left:30%;right:30%;top:0;height:3px;border-radius:0 0 3px 3px;background:var(--acc)}
nav a b{position:absolute;top:2px;right:18%;background:var(--warm);color:#fff;border-radius:99px;font-size:10px;padding:0 5px;line-height:15px}
.q{font-size:20px;line-height:1.4;font-weight:600;margin:14px 0}
.blank{display:inline-block;min-width:54px;border-bottom:2px solid var(--acc);margin:0 3px}
.opt{display:block;width:100%;text-align:left;font:inherit;padding:13px 14px;margin:8px 0;background:var(--card);color:var(--ink);border:1.5px solid var(--line);border-radius:12px;cursor:pointer}
.opt.ok{border-color:var(--ok);background:var(--oks)}
.opt.bad{border-color:var(--bad);background:var(--bads)}
.opt.idk{color:var(--mut);text-align:center;border-style:dashed}
input[type=text],textarea{width:100%;font:inherit;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink)}
textarea{min-height:130px;resize:vertical}
input:focus,textarea:focus{outline:none;border-color:var(--acc)}
.fb{padding:12px 14px;border-radius:12px;margin:12px 0;font-size:15px}
.fb.ok{background:var(--oks);color:var(--ok)}
.fb.bad{background:var(--bads);color:var(--bad)}
.fb span{color:var(--ink)}
.tiles{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0;min-height:44px}
.tile{font:inherit;font-weight:650;padding:9px 13px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.tile.used{opacity:.25;pointer-events:none}
.built{min-height:56px;border-bottom:2px solid var(--line);padding:6px 0;display:flex;flex-wrap:wrap;gap:8px}
.built .tile{background:var(--accs);border-color:transparent;color:var(--acc)}
.big{font-size:32px;font-weight:750;letter-spacing:-.02em;margin:6px 0}
.say{appearance:none;border:0;background:var(--accs);color:var(--acc);width:40px;height:40px;border-radius:50%;font-size:18px;cursor:pointer;flex:none}
.ex{color:var(--mut);font-style:italic}
.seg{display:flex;background:var(--line);border-radius:12px;padding:3px;margin:8px 0 14px}
.seg a{flex:1;text-align:center;padding:8px 0;border-radius:10px;font-size:14px;font-weight:650;color:var(--mut);text-decoration:none;cursor:pointer}
.seg a.on{background:var(--card);color:var(--ink)}
.rd{font-size:19px;line-height:1.75}
.rd .w{border-radius:4px;cursor:pointer}
.rd .w:active{background:var(--accs)}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:9;background:var(--card);border-top:1px solid var(--line);border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));box-shadow:0 -8px 30px rgba(0,0,0,.18);max-height:80vh;overflow:auto}
.sheet>div{max-width:560px;margin:0 auto}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:99px;font-size:14px;z-index:20}
.garden{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}
.gp{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px 2px 4px;text-align:center;font-size:11px;line-height:1.2;overflow:hidden}
.gp svg{display:block;margin:0 auto}
.gp span{display:block;padding:0 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pop{animation:pop .5s ease}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
.seg.s5 a{font-size:13px}
.mut{color:var(--mut)}
.small{font-size:13px}
.err{color:var(--bad)}
.diff del{color:var(--bad)} .diff ins{color:var(--ok);text-decoration:none;font-weight:650}
.hr{height:1px;background:var(--line);margin:14px 0}
a.lnk{color:var(--acc);font-weight:650}
.rd .w.sv{border-bottom:2px solid var(--acc)}
.hit{color:var(--ok);font-weight:700}.miss{color:var(--bad);font-weight:700;text-decoration:underline}
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";
/* ============ DADOS BASE ============ */
const LEVELS=['A2','B1','B2','C1'];
const TOPIC_LABEL={pp:'Present Perfect × Past Simple',prep:'Preposições in/on/at',cond:'Condicionais',modals:'Modais',phrasal:'Phrasal verbs',reported:'Discurso indireto',relative:'Orações relativas',articles:'Artigos e quantificadores',voc:'Vocabulário',leitura:'Leitura',adv:'Gramática avançada'};

const SEED=[
['deadline','prazo','We have a tight deadline on Friday.'],['shift','turno / plantão','I work the night shift this week.'],['coworker','colega de trabalho','My coworker covered for me yesterday.'],
['workload','carga de trabalho','Her workload doubled after the merger.'],['on duty','de serviço / de plantão','He is on duty until 6 a.m.'],['to hand in','entregar','Please hand in your report by noon.'],
['to be in charge of','ser responsável por','Who is in charge of the schedule?'],['to catch up','pôr em dia','I need to catch up on my emails.'],['to get along with','dar-se bem com','I get along with everyone on my team.'],
['to run late','estar atrasado','Sorry, I\'m running late.'],
['though','embora / porém','It was cold, though the sun was out.'],['actually','na verdade','Actually, I\'ve never been there.'],['anyway','enfim / de qualquer forma','Anyway, let\'s get back to work.'],
['barely','mal / quase não','I barely slept last night.'],['to figure out','descobrir / entender','I can\'t figure out how this works.'],['to hang out','sair / passar tempo juntos','We usually hang out on Sundays.'],
['fed up','de saco cheio','I\'m fed up with this traffic.'],['I guess','acho que','I guess you\'re right.'],['whatever','tanto faz / seja o que for','Whatever you decide is fine with me.'],['to mean','querer dizer','What do you mean by that?'],
['to binge-watch','maratonar','We binge-watched the whole season.'],['plot twist','reviravolta','That plot twist was unexpected.'],['subtitles','legendas','I prefer English subtitles.'],['spoiler','revelação do enredo','No spoilers, please!'],
['release date','data de lançamento','The release date was postponed.'],['to stream','transmitir / assistir online','I stream music while I cook.'],['cast','elenco','The cast is amazing.'],['to level up','subir de nível','You level up after each mission.'],
['to get stuck','ficar preso / travar','I got stuck on the last level.'],['to unlock','desbloquear','You can unlock new skills later.'],
['to give up','desistir','Don\'t give up now.'],['to look forward to','aguardar com expectativa','I look forward to meeting you.'],['to come up with','ter a ideia de / bolar','She came up with a great plan.'],
['to break down','quebrar / pifar','The car broke down on the highway.'],['to pick up','pegar / buscar / aprender','I picked up some Spanish while traveling.'],['to turn out','acabar sendo / revelar-se','It turned out to be a mistake.'],
['to end up','acabar (fazendo/ficando)','We ended up staying home.'],['to cut down on','reduzir','I\'m trying to cut down on sugar.'],['to show up','aparecer','He didn\'t show up to the meeting.'],['to work out','dar certo / malhar','Things will work out.']
];

const LESSONS=[
{id:'articles',lvl:'A2',title:'Artigos e quantificadores',intro:'<p><b>a / an</b>: algo singular e contável, primeira menção (<i>an engineer</i>, <i>a shift</i>). <b>the</b>: algo específico, único ou já mencionado. <b>Sem artigo</b>: plural ou incontável em sentido geral (<i>I love music</i>).</p><p><b>many</b> + contável (many chairs) · <b>much</b> + incontável (much time, geralmente em negativas/perguntas) · <b>a few</b> = alguns (contável) · <b>a little</b> = um pouco (incontável) · <b>a lot of</b> serve para os dois.</p>',
 ex:[{t:'mc',q:'There isn\'t ___ milk left.',opts:['many','much','a few','few'],a:1,why:'Milk é incontável, e em negativa usamos <b>much</b>.'},
 {t:'mc',q:'She\'s ___ honest person.',opts:['a','an','the','—'],a:1,why:'<i>honest</i> começa com som de vogal (o "h" é mudo): <b>an</b>.'},
 {t:'fill',q:'There are ___ chairs in the room, so we can sit. (alguns)',a:['a few'],why:'Contável + sentido positivo: <b>a few</b>.'},
 {t:'mc',q:'___ sun rises in the east.',opts:['A','An','The','—'],a:2,why:'Algo único no mundo leva <b>the</b>.'},
 {t:'mc',q:'I love ___.',opts:['the music','a music','music','musics'],a:2,why:'Música em geral é incontável e sem artigo.'}]},
{id:'prep',lvl:'A2',title:'Preposições in / on / at',intro:'<p><b>Tempo</b> — <b>at</b>: horas e momentos (<i>at 7 a.m., at night</i>) · <b>on</b>: dias e datas (<i>on Monday, on May 5th</i>) · <b>in</b>: meses, anos, períodos (<i>in July, in 2024, in the morning</i>).</p><p><b>Lugar</b> — <b>at</b>: ponto (<i>at the door, at work</i>) · <b>in</b>: espaço fechado/cidade (<i>in the car, in Rio</i>) · <b>on</b>: superfície/transporte coletivo (<i>on the table, on the bus</i>).</p>',
 ex:[{t:'mc',q:'The shift starts ___ 7 a.m.',opts:['at','on','in','by'],a:0,why:'Hora exata: <b>at</b>.'},
 {t:'mc',q:'My birthday is ___ March.',opts:['at','on','in','of'],a:2,why:'Meses usam <b>in</b>.'},
 {t:'fill',q:'We met ___ Friday morning.',a:['on'],why:'Dia da semana (mesmo com a parte do dia): <b>on</b>.'},
 {t:'mc',q:'I left my phone ___ the bus.',opts:['in','at','on','to'],a:2,why:'Transporte coletivo: <b>on</b> the bus/train/plane. (Carro e táxi: <i>in</i>.)'},
 {t:'fill',q:'She\'s waiting ___ the entrance.',a:['at'],why:'Ponto específico: <b>at</b>.'}]},
{id:'pp',lvl:'B1',title:'Present Perfect × Past Simple',intro:'<p><b>Past Simple</b>: ação terminada em momento definido (<i>yesterday, last week, in 2020, two days ago</i>).</p><p><b>Present Perfect</b> (<i>have/has + particípio</i>): experiência sem data, ou algo que começou no passado e ainda importa agora. Palavras-chave: <i>for, since, already, yet, ever, never, just</i>.</p><p><i>I lived in SP in 2015.</i> (terminou) · <i>I\'ve lived in Rio since 2015.</i> (ainda moro)</p>',
 ex:[{t:'mc',q:'She ___ the report an hour ago.',opts:['has finished','finished','finishes','has been finishing'],a:1,why:'<i>ago</i> pede Past Simple.'},
 {t:'fill',q:'I ___ (not / see) that movie yet.',a:['haven\'t seen','have not seen'],why:'<i>yet</i> + experiência até agora: Present Perfect.'},
 {t:'mc',q:'We ___ each other since 2018.',opts:['know','knew','have known','are knowing'],a:2,why:'<i>since</i> + verbo de estado: <b>have known</b>.'},
 {t:'order',words:['Have','you','ever','been','to','London'],a:'Have you ever been to London?',why:'Pergunta de experiência: <i>Have you ever + particípio</i>.'},
 {t:'fill',q:'Last year, they ___ (move) to Nova Iguaçu.',a:['moved'],why:'<i>Last year</i> = tempo definido: Past Simple.'}]},
{id:'modals',lvl:'B1',title:'Modais: must, have to, should, might',intro:'<p><b>must</b>: obrigação forte ou certeza · <b>have to</b>: obrigação externa · <b>should</b>: conselho · <b>might / may</b>: possibilidade · <b>could / can</b>: capacidade e pedidos educados.</p><p>Cuidado: <b>don\'t have to</b> = não é necessário · <b>mustn\'t</b> = é proibido.</p>',
 ex:[{t:'mc',q:'You ___ park here. It\'s forbidden.',opts:['don\'t have to','mustn\'t','shouldn\'t have','might not'],a:1,why:'Proibição: <b>mustn\'t</b>.'},
 {t:'mc',q:'You ___ come tomorrow; it\'s optional.',opts:['mustn\'t','can\'t','don\'t have to','shouldn\'t'],a:2,why:'Não é necessário: <b>don\'t have to</b>.'},
 {t:'fill',q:'You look tired. You ___ get some rest. (conselho)',a:['should'],why:'Conselho: <b>should</b>.'},
 {t:'mc',q:'It ___ rain later, so take an umbrella.',opts:['must','might','has to','will have'],a:1,why:'Possibilidade: <b>might</b>.'},
 {t:'order',words:['Could','you','help','me','with','this','report'],a:'Could you help me with this report?',why:'Pedido educado: <i>Could you + verbo base</i>.'}]},
{id:'cond',lvl:'B1',title:'Condicionais e wish',intro:'<p><b>0</b>: If + presente, presente (verdades). <b>1</b>: If + presente, <i>will</i> (possível). <b>2</b>: If + passado, <i>would</i> (hipótese agora). <b>3</b>: If + <i>had</i> + particípio, <i>would have</i> + particípio (passado irreal).</p><p><b>wish</b> + passado = desejo sobre o presente: <i>I wish I had more time.</i> No tipo 2 usamos <b>were</b> para todos: <i>If I were you…</i></p>',
 ex:[{t:'mc',q:'If I ___ you, I would ask for a raise.',opts:['am','were','will be','would be'],a:1,why:'Tipo 2 usa <b>were</b> (If I were you).'},
 {t:'fill',q:'If you heat ice, it ___ (melt).',a:['melts'],why:'Tipo 0 (verdade geral): presente simples.'},
 {t:'mc',q:'If we had left earlier, we ___ the train.',opts:['would catch','would have caught','will catch','had caught'],a:1,why:'Tipo 3: <b>would have + particípio</b>.'},
 {t:'order',words:['If','it','rains','we','will','stay','home'],a:'If it rains, we will stay home.',why:'Tipo 1: If + presente, will + verbo.'},
 {t:'fill',q:'I wish I ___ (have) more free time.',a:['had'],why:'<i>wish</i> + passado para o presente irreal.'}]},
{id:'phrasal',lvl:'B1',title:'Phrasal verbs do dia a dia',intro:'<p>Verbo + partícula muda o sentido. Alguns aceitam objeto no meio (<i>turn the TV off / turn it off</i>), outros não (<i>look after kids</i>).</p><p><b>deal with</b> lidar com · <b>put off</b> adiar · <b>run out of</b> ficar sem · <b>look into</b> investigar · <b>set up</b> montar/configurar · <b>carry out</b> executar · <b>find out</b> descobrir.</p>',
 ex:[{t:'mc',q:'We need to ___ this problem before the inspection.',opts:['deal with','run out of','put off','set up'],a:0,why:'<b>deal with</b> = lidar com / resolver.'},
 {t:'mc',q:'The team will ___ the meeting until next week.',opts:['find out','carry out','look into','put off'],a:3,why:'<b>put off</b> = adiar.'},
 {t:'fill',q:'We\'ve ___ out of coffee. Can you buy some? (run)',a:['run'],why:'<b>run out of</b> = ficar sem (o verbo é "run": have run out).'},
 {t:'mc',q:'The police will ___ the accident.',opts:['look into','put up','turn out','give in'],a:0,why:'<b>look into</b> = investigar.'},
 {t:'fill',q:'Please ___ up the new system before Monday.',a:['set'],why:'<b>set up</b> = montar / configurar.'}]},
{id:'reported',lvl:'B2',title:'Discurso indireto',intro:'<p>Ao reportar, o verbo recua um tempo: presente → passado, passado → <i>past perfect</i>, <i>will</i> → <i>would</i>, <i>can</i> → <i>could</i>. Marcadores mudam: <i>today → that day, tomorrow → the next day, here → there</i>.</p><p><b>say</b> (sem objeto: <i>he said that…</i>) × <b>tell</b> (com objeto: <i>he told me that…</i>).</p>',
 ex:[{t:'mc',q:'He said, "I am tired." → He said he ___ tired.',opts:['is','was','has been','will be'],a:1,why:'Presente recua para passado.'},
 {t:'mc',q:'She told me she ___ the email the day before.',opts:['sent','sends','had sent','has sent'],a:2,why:'Passado recua para <b>past perfect</b>.'},
 {t:'fill',q:'"I will call you tomorrow," he said. → He said he ___ call me the next day.',a:['would'],why:'<i>will</i> vira <b>would</b>.'},
 {t:'mc',q:'He ___ me that the meeting was cancelled.',opts:['said','told','spoke','talked'],a:1,why:'Com objeto (me), usa-se <b>told</b>.'},
 {t:'order',words:['She','said','she','was','leaving'],a:'She said she was leaving.',why:'<i>She said she was leaving</i> — recuo de tempo.'}]},
{id:'relative',lvl:'B2',title:'Orações relativas',intro:'<p><b>who</b> (pessoas) · <b>which</b> (coisas) · <b>that</b> (pessoas/coisas, sem vírgula) · <b>whose</b> (posse) · <b>where</b> (lugar).</p><p>Sem vírgula (essencial): <i>The man who called…</i> Com vírgulas (extra): <i>My boss, who lives in Niterói, …</i> — aqui <b>não</b> se usa <i>that</i>.</p>',
 ex:[{t:'mc',q:'The colleague ___ helped me is on leave.',opts:['who','which','whose','where'],a:0,why:'Pessoa que faz a ação: <b>who</b>.'},
 {t:'mc',q:'That\'s the woman ___ son plays for Flamengo.',opts:['who','that','whose','which'],a:2,why:'Posse: <b>whose</b>.'},
 {t:'fill',q:'This is the station ___ I take the train.',a:['where'],why:'Lugar: <b>where</b>.'},
 {t:'mc',q:'My boss, ___ lives in Niterói, is retiring.',opts:['that','who','which','whose'],a:1,why:'Entre vírgulas não usa <i>that</i>; pessoa → <b>who</b>.'},
 {t:'fill',q:'The book ___ I bought yesterday is great.',a:['that','which'],why:'Coisa: <b>that</b> ou <b>which</b>.'}]}
];

/* ===== REGRAS DE OURO por lição: [pergunta, opções (a 1ª é a correta), dica memorável] ===== */
const RULES={
 articles:{rules:{
  a_an:['Quando usamos "an" em vez de "a"?',['Antes de SOM de vogal','Antes de palavras no plural','Antes de palavras longas'],'<b>an</b> + som de vogal (an engineer, an hour). Conta o som, não a letra.'],
  afew:['"A few" é usado com substantivos contáveis ou incontáveis?',['Contáveis (alguns)','Incontáveis','Com os dois'],'<b>a few</b> = alguns (contável) · <b>a little</b> = um pouco (incontável).'],
  much:['Com incontáveis (milk, time), qual quantificador usamos em negativas e perguntas?',['much','many','a few'],'<b>much</b> + incontável · <b>many</b> + contável · <b>a lot of</b> serve para os dois.'],
  the:['Quando usamos "the"?',['Algo específico, único ou já mencionado','Sempre antes de qualquer substantivo','Só com plurais'],'<b>the</b> = específico, único ou já citado (the sun, the report).'],
  zero:['Ao falar de algo em geral (música, amor), usamos artigo?',['Não: sem artigo','Sim: the','Sim: a'],'Plural ou incontável em sentido geral = <b>sem artigo</b> (I love music).']},
  map:['much','a_an','afew','the','zero']},

let AC=null;
function ac(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC}catch(e){return null}}
function tone(f,t0,dur,type,vol){const a=ac();if(!a)return;try{const o=a.createOscillator(),g=a.createGain(),t=a.currentTime+t0;o.type=type||'sine';o.frequency.value=f;
 g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol||.18,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+dur+.03)}catch(e){}}
function sfx(k){if(S.sound===false)return;
 if(k==='ok'){tone(784,0,.2,'sine',.2);tone(1175,.1,.32,'sine',.2);tone(2350,.1,.2,'triangle',.03)}
 else if(k==='bloom'){[523,659,784,1047,1319,1568].forEach((f,i)=>tone(f,i*.075,.4,'sine',.17))}
 else if(k==='bad'){tone(247,0,.16,'triangle',.17);tone(185,.11,.3,'triangle',.17)}}

const POS={noun:'substantivo',verb:'verbo',adjective:'adjetivo',adverb:'advérbio',pronoun:'pronome',preposition:'preposição',conjunction:'conjunção',interjection:'interjeição',exclamation:'exclamação',determiner:'determinante'};
async function getJson(u){const r=await fetch(u);if(!r.ok)throw new Error('Serviço indisponível agora.');return r.json()}
async function translateFree(t){const d=await getJson('https://api.mymemory.translated.net/get?q='+encodeURIComponent(String(t).slice(0,480))+'&langpair=en|pt-BR');
 const x=(d.responseData&&d.responseData.translatedText)||'';
 if(d.responseStatus==429||/MYMEMORY WARNING|QUERY LENGTH/i.test(x))throw new Error('Limite diário da tradução gratuita atingido. Tente amanhã.');return x}
async function freeLookup(w){const out={pt:'',alts:[],classe:'',nota:'',ipa:'',lema:''};
 const [mm,dd]=await Promise.allSettled([getJson('https://api.mymemory.translated.net/get?q='+encodeURIComponent(w)+'&langpair=en|pt-BR'),getJson('https://api.dictionaryapi.dev/api/v2/entries/en/'+encodeURIComponent(w.toLowerCase()))]);
 if(mm.status==='fulfilled'){const d=mm.value,all=[(d.responseData&&d.responseData.translatedText)||''].concat((d.matches||[]).map(m=>m.translation)),set=[];
  all.forEach(t=>{t=String(t||'').trim().toLowerCase().replace(/[.!]+$/,'');if(t&&!/mymemory/i.test(t)&&t!==w.toLowerCase()&&!set.includes(t)&&set.length<4)set.push(t)});out.pt=set[0]||'';out.alts=set.slice(1)}
 if(dd.status==='fulfilled'&&Array.isArray(dd.value)&&dd.value[0]){const e=dd.value[0];out.lema=e.word||'';out.ipa=e.phonetic||((e.phonetics||[]).find(p=>p.text)||{}).text||'';
  const m=(e.meanings||[])[0];if(m){out.classe=POS[m.partOfSpeech]||m.partOfSpeech||'';const df=(m.definitions||[])[0];if(df)out.nota='Definição: '+df.definition}}
 if(!out.pt&&!out.nota)throw new Error('Não encontrei. Sem conexão ou palavra rara; digite a tradução.');return out}

async function speak(t,rate){
 try{if(TTS&&!(rate&&rate<1)){await TTS.speak(t,{language:'en'});return}}catch(e){}
 try{const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=rate||.92;const vs=speechSynthesis.getVoices();
  const v=vs.find(v=>v.lang==='en-US')||vs.find(v=>/^en/.test(v.lang));if(v)u.voice=v;speechSynthesis.cancel();speechSynthesis.speak(u)}
 catch(e){toast('Áudio indisponível aqui')}
}

function nextIv(c,g){const x=Object.assign({},c);applyGrade(x,g);return x.iv}
function applyGrade(c,g){
 if(g===0){c.n=0;c.iv=0;c.ef=Math.max(1.3,c.ef-.2);c.due=Date.now()+60e3;c.lapses=(c.lapses||0)+1;return}
 c.n=(c.n||0)+1;
 if(c.n===1)c.iv=g===3?3:1;
 else if(c.n===2)c.iv=g===1?3:g===2?6:9;
 else c.iv=Math.max(1,Math.round(c.iv*(g===1?1.2:g===2?c.ef:c.ef*1.3)));
 if(g===1)c.ef=Math.max(1.3,c.ef-.15);if(g===3)c.ef=c.ef+.1;
 c.due=Date.now()+c.iv*DAY}
const ivLabel=d=>d===0?'1 min':d<30?d+(d===1?' dia':' dias'):Math.round(d/30)+' mês';

 const id='q'+hash(q);if(S.cards.some(c=>c.id===id))return;
 S.cards.push({id,kind:'q',q,a,why:it.why||'',en:q,pt:a,st:'learn',n:0,iv:0,ef:2.5,due:Date.now()+10*60e3,src:'erro'})}

  if(!r.res)h+=`<button class="btn" data-a="ordcheck" ${r.built.length===it.words.length?'':'disabled'}>Conferir</button>`}
 if(r.res){const ok=r.res.ok;const ans=ansText(it);
  h+=`<div class="fb ${ok?'ok':'bad'}"><b>${ok?'Correto!':'Não foi dessa vez.'}</b> ${ok?'':`Resposta: <span><b>${esc(ans)}</b></span>. `}<span>${it.why||''}</span>${it.t==='listen'?'<br><span class="ex">'+esc(it.audio)+'</span>':''}${it.t==='dict'?(it.pt?'<br><span class="mut">'+esc(it.pt)+'</span>':'')+(!ok?'<br>'+diffHtml(it.a[0],r.res.given):''):''}</div>${it.tip&&!it.isRule?`<div class="card small" style="border-color:var(--acc)"><b>Regra de ouro:</b> ${it.tip}</div>`:''}<button class="btn" data-a="next">Continuar</button>`}

const nm=s=>normA(s).replace(/^to /,'');
function plant(g,o){o=o||{};const s=o.size||44,w=!!o.wilt;g=Math.max(0,Math.min(6,g|0));
 const stem=w?'#a58f55':'#3f9d5a',leaf=w?'#b7a56a':'#4cb26a';
 let p='<ellipse cx="24" cy="43" rx="15" ry="4" fill="#8b6b4a"/>';
 if(g===0)p+='<ellipse cx="24" cy="40.5" rx="4" ry="2.6" fill="#b98a4a"/>';
 else{const top=[0,34,29,25,21,19,19][g];
  p+=`<path d="M24 41 L24 ${top}" stroke="${stem}" stroke-width="2.6" stroke-linecap="round" fill="none"/>`;
  const lv=[[],[[-1,37]],[[-1,36],[1,32]],[[-1,36],[1,32],[-1,28]],[[-1,37],[1,33],[-1,29],[1,25]],[[-1,37],[1,33],[-1,29],[1,25]],[[-1,37],[1,33],[-1,29],[1,25]]][g];
  lv.forEach(([d,y])=>{const cx=24+d*6.2;p+=`<ellipse cx="${cx}" cy="${y}" rx="5.4" ry="2.7" fill="${leaf}" transform="rotate(${d<0?-28:28} ${cx} ${y})"/>`});
  if(g===4)p+=`<circle cx="24" cy="${top-1}" r="3" fill="${leaf}"/>`;
  if(g===5)p+=`<circle cx="24" cy="${top-2}" r="4.6" fill="${w?'#c9a9a0':'#ef8fae'}"/>`;
  if(g===6){const pc=w?'#c9a9a0':'#f28bb0';for(let i=0;i<5;i++){const a=i*72*Math.PI/180;p+=`<circle cx="${(24+Math.sin(a)*6.4).toFixed(1)}" cy="${(14.5-Math.cos(a)*6.4).toFixed(1)}" r="4.6" fill="${pc}"/>`}
   p+=`<circle cx="24" cy="14.5" r="3.6" fill="${w?'#d3c28a':'#f6c445'}"/>`}}
 return `<svg viewBox="0 0 48 48" width="${s}" height="${s}" aria-hidden="true">${p}</svg>`}
const gp=c=>`<div class="gp">${plant(c.st==='new'?(c.g||0):6,{size:44,wilt:c.st!=='new'&&Date.now()-c.due>DAY})}<span>${esc(c.en)}</span></div>`;

function pickOthers(c,fn,n){const pool=S.cards.filter(x=>x.kind!=='q'&&x.id!==c.id);const seen=new Set([fn(c).toLowerCase()]);const out=[];
 for(const x of shuffle(pool)){const v=fn(x),k=v.toLowerCase();if(!seen.has(k)){seen.add(k);out.push(v)}if(out.length>=n)break}return out}
function mkEx(c){const g=Math.min(5,c.g||0),en=nm(c.en),e={id:c.id,g,res:null,built:[],sel:null};
 if(g<=2){const toEn=g!==0,corr=toEn?c.en:c.pt,others=pickOthers(c,x=>toEn?x.en:x.pt,3),opts=shuffle([corr].concat(others));
  Object.assign(e,{type:g===2?'listen':'mc',toEn,opts,a:opts.indexOf(corr)});return e}
 e.expect=en;
 if(g===3){const toks=en.split(' ');let tiles;
  if(toks.length===1){const extra=shuffle('abcdefghijklmnopqrstuvwxyz'.split('').filter(l=>!en.includes(l))).slice(0,3);tiles=shuffle(en.split('').concat(extra));e.join=''}
  else{const ws=[...new Set([].concat(...S.cards.filter(x=>x.id!==c.id&&x.kind!=='q').map(x=>nm(x.en).split(' '))).filter(w=>w.length>1&&!toks.includes(w)))];tiles=shuffle(toks.concat(shuffle(ws).slice(0,2)));e.join=' '}
  e.type='build';e.tiles=tiles;return e}
 e.type=g===4?'type':'ltype';return e}
function gNext(){const G=V.grow;if(!G.q.length){G.phase='done';G.ex=null;save();return}
 let id=G.q.shift();if(id===G.lastId&&G.q.length){G.q.push(id);id=G.q.shift()}G.lastId=id;G.ex=mkEx(S.cards.find(c=>c.id===id))}
function gAnswer(ok){const G=V.grow,e=G.ex,c=S.cards.find(x=>x.id===e.id);if(e.res)return;e.res={ok};noteTopic('voc',ok);const b=c.g||0;
 if(ok){c.g=b+1;if(c.g>=6){c.g=6;c.st='learn';c.n=0;c.iv=0;c.ef=c.ef||2.5;c.due=Date.now()+4*36e5;S.intro.n++;touch('nw');e.bloom=true;G.bloomed++}}
 else{c.g=b>=3?b-1:b;c.lapses=(c.lapses||0)+1}
 e.after=c.g;sfx(ok?(e.bloom?'bloom':'ok'):'bad');
 if(!(ok&&c.g>=6)){if(ok)G.q.push(c.id);else G.q.splice(Math.min(2,G.q.length),0,c.id)}
 touch('ex');save();render()}

 const e=G.ex,c=S.cards.find(x=>x.id===e.id);
 const tot=G.ids.reduce((s,id)=>{const x=S.cards.find(y=>y.id===id);return s+Math.min(6,(x&&x.g)||0)},0),pct=Math.round(tot/(6*G.total)*100);
 let h=`<div class="row sp"><span class="chip">${G.bloomed}/${G.total} floresceram</span><button class="btn ghost sm" data-a="gquit">Sair</button></div><div class="bar" style="margin:10px 0"><i style="width:${pct}%"></i></div>`;
 h+=`<div style="text-align:center;margin:4px 0" class="${e.res&&e.res.ok?'pop':''}">${plant(e.res?e.after:e.g,{size:58})}</div>`;

 if(e.type==='mc')h+=lab(e.toEn?'Como se diz em inglês?':'O que significa?')+big(e.toEn?c.pt:c.en)+(e.toEn?'':spk)+opts();

function ladder(){const L=S.level;return `<div class="ladder">${LEVELS.map(l=>`<div class="${L&&(L===l||(LEVELS.indexOf(L)>LEVELS.indexOf(l)))?'on':''} ${L===l?'now':''}">${l}</div>`).join('')}</div><p class="sub small" style="margin-top:8px">Meta: C1 (fluência avançada)</p>`}
function recLesson(){const ls=allLessons();const undone=ls.filter(l=>!S.lessons[l.id]);
 const weak=ls.filter(l=>acc(l.id)!==null&&acc(l.id)<.75&&(!S.lessons[l.id]||S.lessons[l.id].best<80)).sort((a,b)=>acc(a.id)-acc(b.id));
 if(weak.length)return weak[0];
 const li=Math.max(0,LEVELS.indexOf(S.level||'A2'));
 const ok=undone.filter(l=>LEVELS.indexOf(l.lvl)<=li+1);if(ok.length)return ok[0];
 if(undone.length)return undone[0];
 return ls.slice().sort((a,b)=>((S.lessons[a.id]||{}).best||0)-((S.lessons[b.id]||{}).best||0))[0]}
function weakList(){return Object.keys(S.topics).filter(t=>{const o=S.topics[t];return o.r+o.w>=2}).map(t=>[t,acc(t)]).sort((a,b)=>a[1]-b[1]).slice(0,4)}

async function ask(prompt){if(!SMP)throw new Error('Recurso do Claude indisponível aqui.');
 try{if(typeof SMP.json==='function')return await SMP.json(prompt)}catch(e){if(e&&e.code==='not_granted')throw new Error('Permissão negada.');}
 const r=await SMP(prompt);const t=(r&&r.text)||'';const m=t.match(/\{[\s\S]*\}/);if(!m)throw new Error('Resposta inesperada.');return JSON.parse(m[0])}
function aiMsg(e){if(e&&e.name==='TypeError')return 'Sem conexão com o serviço de busca. Digite a tradução.';return e&&e.code==='rate_limited'?'Muitas chamadas seguidas. Aguarde um pouco.':(e&&e.message)||'Não consegui agora. Tente de novo.'}

async function aiTrain(){const topic=(document.getElementById('aitopic')||{}).value||'';
 const weak=weakList().map(([t])=>TOPIC_LABEL[t]||t).join(', ')||'não identificados';
 toast('Gerando exercícios…');
 const p=`Você é professor de inglês. Aluno brasileiro, nível ${S.level||'B1'} (meta: C1). Pontos fracos: ${weak}. Tema pedido: ${topic||'livre, nos pontos fracos'}.
Crie 6 exercícios variados e sem ambiguidade. Responda SOMENTE um JSON: {"titulo":"...","itens":[{"t":"mc","q":"frase com ___","opts":["a","b","c","d"],"a":0,"why":"explicação curta em português"},{"t":"fill","q":"frase com ___ (dica)","a":["resposta","variação"],"why":"..."},{"t":"order","words":["Have","you","ever","been"],"a":"Have you ever been there?","why":"..."}]}. Em mc, "a" é o índice (0 a 3) e varie a posição. Use frases naturais de trabalho, dia a dia ou entretenimento.`;
 try{const r=await ask(p);const items=(r.itens||[]).filter(x=>x&&((x.t==='mc'&&Array.isArray(x.opts)&&typeof x.a==='number')||(x.t==='fill'&&Array.isArray(x.a))||(x.t==='order'&&Array.isArray(x.words)&&x.a)));
  if(!items.length)throw new Error('Não consegui montar os exercícios.');
  startRun({kind:'ai',title:r.titulo||'Treino com Claude',items})}catch(e){toast(aiMsg(e))}}

  const picked=growing.concat(seeds).slice(0,need);if(!picked.length)return;

  V.grow={ids:picked.map(c=>c.id),intro,ii:0,phase:intro.length?'intro':'test',q:shuffle(picked.map(c=>c.id)),bloomed:0,total:picked.length,ex:null,lastId:null};

const M=(q,o,a,why,r)=>({t:'mc',q,opts:o,a,why,r});
const F=(q,a,why,r)=>({t:'fill',q,a:Array.isArray(a)?a:[a],why,r});
const T=(q,a,why,r)=>({t:'tr',q,a:Array.isArray(a)?a:[a],why,r});
function NL(id,lvl,title,intro,rules,ex){const l={id,lvl,title,intro,ex,rules:{}};

 LESSONS.push(l);TOPIC_LABEL[id]=title}

const known=()=>(S.known=S.known||{});
const checks=()=>(S.checks=S.checks||{});
function canon(s){s=String(s||'').toLowerCase().replace(/[’`´]/g,"'");
 s=s.replace(/\bwon't\b/g,'will not').replace(/\bcan't\b/g,'can not').replace(/\bcannot\b/g,'can not').replace(/\bshan't\b/g,'shall not').replace(/\bain't\b/g,'is not')
  .replace(/n't\b/g,' not').replace(/\bgonna\b/g,'going to').replace(/\bwanna\b/g,'want to').replace(/\bgotta\b/g,'got to').replace(/\blet's\b/g,'let us');
 s=s.replace(/\b(he|she|it|that|there|what|who|here|where)'s (been|got|done|gone|had|already|just|never|ever|finished|lost|left|become|seen|made|taken)\b/g,'$1 has $2')
  .replace(/\b(i|you|he|she|it|we|they|who)'d (been|had|already|just|never|ever|done|gone|seen|left|finished|met)\b/g,'$1 had $2')
  .replace(/\b(he|she|it|that|there|what|who|here|where)'s\b/g,'$1 is').replace(/'re\b/g,' are').replace(/'ve\b/g,' have').replace(/'ll\b/g,' will').replace(/'m\b/g,' am').replace(/'d\b/g,' would');
 return s.replace(/[^a-z0-9' ]/g,' ').replace(/\s+/g,' ').trim()}
function cmpToks(target,heard){const a=canon(target).split(' ').filter(Boolean),b=canon(heard).split(' ').filter(Boolean);
 const n=a.length,m=b.length,D=Array.from({length:n+1},()=>new Array(m+1).fill(0));
 for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)D[i][j]=a[i]===b[j]?D[i+1][j+1]+1:Math.max(D[i+1][j],D[i][j+1]);
 const hit=new Array(n).fill(false);let i=0,j=0;
 while(i<n&&j<m){if(a[i]===b[j]){hit[i]=true;i++;j++}else if(D[i+1][j]>=D[i][j+1])i++;else j++}
 return{score:n?D[0][0]/n:0,words:a.map((w,k)=>({w,ok:hit[k]}))}}
function diffHtml(target,given){const r=cmpToks(target,given);return r.words.map(x=>`<span class="${x.ok?'hit':'miss'}">${esc(x.w)}</span>`).join(' ')}

function matchTyped(it,val){const c=canon(val);if(!c)return false;
 if(it.a.some(x=>normA(x)===normA(val)||canon(x)===c))return true;
 if(it.t==='dict')return cmpToks(it.a[0],val).score>=.92;return false}

function recog(onres,onerr){const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R){onerr('unsupported');return null}
 let got=false;const r=new R();r.lang='en-US';r.interimResults=false;r.maxAlternatives=3;
 r.onresult=e=>{got=true;const alts=[];for(const a of e.results[0])alts.push(a.transcript);onres(alts)};
 r.onerror=e=>{if(!got){got=true;onerr(e.error||'error')}};
 r.onend=()=>{if(!got){got=true;onerr('no-speech')}};
 try{r.start()}catch(e){onerr('error');return null}return r}

const ARCH=new Set('thee thou thy thine thyself hath doth dost art shalt wilt unto ye lo behold nay yea hast wast didst canst wouldest shouldest saith maketh cometh goeth giveth'.split(' '));
let COMMON_SET=null;
function wordForms(w){const o=[w];if(w.endsWith('ies'))o.push(w.slice(0,-3)+'y');if(w.endsWith('ied'))o.push(w.slice(0,-3)+'y');
 if(w.endsWith('ing')){o.push(w.slice(0,-3),w.slice(0,-3)+'e');if(/(.)\1$/.test(w.slice(0,-3)))o.push(w.slice(0,-4))}
 if(w.endsWith('ed')){o.push(w.slice(0,-2),w.slice(0,-1));if(/(.)\1$/.test(w.slice(0,-2)))o.push(w.slice(0,-3))}
 if(w.endsWith('es'))o.push(w.slice(0,-2));if(w.endsWith('s'))o.push(w.slice(0,-1));
 if(w.endsWith('ly'))o.push(w.slice(0,-2));if(w.endsWith('er'))o.push(w.slice(0,-2),w.slice(0,-1));if(w.endsWith('est'))o.push(w.slice(0,-3));return o}
function covData(sents){
 if(!COMMON_SET)COMMON_SET=new Set(COMMON.split(/\s+/));
 const KS=new Set(COMMON_SET);Object.keys(known()).forEach(x=>KS.add(x));
 S.cards.filter(c=>c.kind!=='q'&&c.st!=='new').forEach(c=>c.en.toLowerCase().split(/\s+/).forEach(x=>KS.add(x.replace(/[^a-z']/g,''))));
 const txt=sents.join(' '),re=/[A-Za-z][A-Za-z'’]*/g,cnt={};let m,total=0,ok=0,arch=0;
 while((m=re.exec(txt))){let w=m[0].replace(/’/g,"'");
  if(/^[A-Z]/.test(w)&&w!=='I'){const pre=txt.slice(0,m.index).replace(/\s+$/,'');if(pre&&!/[.!?:"“”;]$/.test(pre))continue}
  w=w.toLowerCase();if(/n't$/.test(w)){w=({"can't":'can',"won't":'will',"shan't":'shall'})[w]||w.slice(0,-3)}
  w=w.replace(/'(s|ll|re|ve|d|m)$/,'').replace(/'$/,'');if(!w||w.length<2&&w!=='a'&&w!=='i')continue;
  total++;if(ARCH.has(w)){arch++;ok++;continue}
  if(wordForms(w).some(f=>KS.has(f)))ok++;else cnt[w]=(cnt[w]||0)+1}
 const unk=Object.keys(cnt).map(w=>[w,cnt[w]]).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0]));
 return{total,ok,arch,pct:total?Math.round(ok/total*100):0,unk}}
function covLabel(p){return p>=98?['Ótimo: dá para ler sem dicionário.','var(--ok)']:p>=95?['Bom: confortável, com pouco apoio.','var(--ok)']:p>=90?['Desafiador: vale ler com apoio.','var(--warm)']:['Difícil: muitas palavras novas; use para estudar vocabulário.','var(--bad)']}
function covCard(){if(!V.read)return '';const c=covData(V.read.sents),L=covLabel(c.pct),have=new Set(S.cards.map(x=>x.en.toLowerCase()));
 const list=c.unk.slice(0,20);const todo=c.unk.filter(([w])=>!have.has(w));
 return `<h2>Cobertura do texto</h2><div class="card"><div class="row sp"><span class="sub">Você conhece cerca de</span><span class="num" style="font-size:30px;color:${L[1]}">${c.pct}%</span></div><div class="bar" style="margin:6px 0"><i style="width:${c.pct}%;background:${L[1]}"></i></div><p class="small"><b>${L[0]}</b></p><p class="sub small">Estudos indicam que 95% a 98% de palavras conhecidas permitem uma leitura confortável. A estimativa usa as ~700 palavras mais comuns, as que você estuda e as que você marcar como “já sei”${c.arch?`; ${c.arch} palavras arcaicas (thee, hath…) foram contadas como conhecidas`:''}.</p>
 ${list.length?`<div class="hr"></div><b class="small">Palavras que faltam (${c.unk.length})</b>${list.map(([w,n])=>`<div class="row sp" style="padding:5px 0"><span>${esc(w)} <span class="mut small">${n>1?'×'+n:''}${have.has(w)?' · salva':''}</span></span><span>${have.has(w)?'':`<button class="btn ghost sm" data-a="knowW" data-v="${esc(w)}">Já sei</button> <button class="btn sec sm" data-a="saveOne" data-v="${esc(w)}">Salvar</button>`}</span></div>`).join('')}${todo.length?`<button class="btn" style="margin-top:10px" data-a="saveUnk">Salvar e traduzir as ${Math.min(20,todo.length)} primeiras</button><button class="btn ghost" data-a="knowAll">Já conheço todas</button>`:''}`:'<p class="small">Nenhuma palavra desconhecida.</p>'}</div>`}
async function bulkSave(words){if(!words.length)return;const sents=(V.read&&V.read.sents)||[];toast('Traduzindo '+words.length+' palavras…');
 let pairs=[];
 if(SMP&&words.length>1){try{const r=await ask(`Traduza para português do Brasil cada palavra inglesa abaixo, no sentido mais comum (verbos no infinitivo). Responda SOMENTE JSON: {"itens":[{"en":"palavra","pt":"tradução"}]}\n\n`+words.join('\n'));pairs=(r.itens||[]).map(x=>[String(x.en||'').toLowerCase(),String(x.pt||'')])}catch(e){}}
 const got=new Set(pairs.filter(p=>p[1]).map(p=>p[0])),rest=words.filter(w=>!got.has(w));
 for(let i=0;i<rest.length;i+=4){await Promise.all(rest.slice(i,i+4).map(async w=>{try{const o=await freeLookup(w);pairs.push([w,o.pt||''])}catch(e){}}))}
 const have=new Set(S.cards.map(c=>c.en.toLowerCase()));let n=0;
 pairs.forEach(([en,pt])=>{if(!en||!pt||have.has(en))return;have.add(en);
  const s=sents.find(x=>new RegExp('\\b'+en.replace(/[^a-z]/g,'')+'\\w*','i').test(x))||'';
  S.cards.push({id:'t'+hash(en),en,pt,ex:s,st:'new',n:0,iv:0,ef:2.5,due:0,src:'texto'});n++});
 save();render();toast(n?`${n} palavras salvas nas sementes`:'Não consegui traduzir agora')}

Object.assign(A,{
 wkman(v){const [k,d]=String(v).split(':');wkInc(k,+d);render()},
 claudePrompt(){copy(claudeText())},
 slow(v){speak(v,.6)},
 unitCheck(v){const u=UNITS.find(x=>x.id===v);if(!u)return;const pool=[];
  u.ls.forEach(id=>{const l=allLessons().find(x=>x.id===id);if(l)l.ex.forEach(x=>pool.push(Object.assign({topic:l.id,tip:''},x)))});
  if(!pool.length)return;startRun({kind:'mini',unitId:u.id,title:'Mini-teste · '+u.t,items:shuffle(pool).slice(0,10)})},
 startDict(){V.rsub='ouvir';const li=lvlIdx(),lv=LEVELS;
  const pool=SENT.filter(s=>lv.indexOf(s[2])<=li+1);
  startRun({kind:'dict',title:'Ditado',items:shuffle(pool).slice(0,6).map(s=>({t:'dict',topic:'listen',q:'',a:[s[0]],pt:s[1]}))})},
 startListen(v){V.rsub='ouvir';const d=DIALOGS[+v];if(!d)return;
  const items=d.qs.map(q=>{const o=shuffle(q.opts.map((t,i)=>({t,c:i===q.a})));return{t:'listen',topic:'listen',audio:d.text,q:q.q,opts:o.map(z=>z.t),a:o.findIndex(z=>z.c),why:q.why}});
  startRun({kind:'listen',dlgId:d.id,title:d.title,items})},
 spStart(){V.rsub='falar';const li=lvlIdx(),lv=LEVELS;const pool=SENT.filter(s=>lv.indexOf(s[2])<=li+1);
  V.sp={items:shuffle(pool).slice(0,5),i:0,res:null,busy:false,err:'',hide:false,sum:[],done:false,tries:0};render()},
 spExit(){if(V.sp&&V.sp.rec){try{V.sp.rec.abort()}catch(e){}}V.sp=null;render()},
 spHide(){V.sp.hide=!V.sp.hide;render()},
 spRec(){const sp=V.sp;if(!sp||sp.busy)return;sp.busy=true;sp.err='';render();const it=sp.items[sp.i];
  sp.rec=recog(alts=>{let best=null;alts.forEach(a=>{const r=cmpToks(it[0],a);if(!best||r.score>best.r.score)best={r,a}});
   sp.busy=false;sp.res=best.r;sp.heard=best.a;sp.tries++;sfx(best.r.score>=.8?'ok':'bad');render()},
   c=>{sp.busy=false;sp.err=recMsg(c);render()})},
 spNext(){const sp=V.sp;sp.sum.push(sp.res?sp.res.score:0);sp.i++;sp.res=null;sp.err='';
  if(sp.i>=sp.items.length){sp.done=true;wkInc('speak',sp.sum.length);touch('ex')}render();scrollTo(0,0)},
 wcopy(){const t=((document.getElementById('wtext')||{}).value||'').trim();if(!t){toast('Escreva o texto primeiro');return}V.wtext=t;
  copy(`Corrija meu texto em inglês (sou brasileiro, nível ${S.level==='A1'?'A2':S.level||'B1'}, meta C1). Mostre a versão corrigida, depois liste cada erro com a explicação em português e termine com uma dica.\n\n${t}`)},
 knowW(v){known()[v]=1;save();render()},
 knowAll(){const c=covData(V.read.sents);c.unk.forEach(([w])=>{known()[w]=1});save();render()},
 saveOne(v){bulkSave([v])},
 saveUnk(){const c=covData(V.read.sents),have=new Set(S.cards.map(x=>x.en.toLowerCase()));bulkSave(c.unk.map(x=>x[0]).filter(w=>!have.has(w)).slice(0,20))}
});
